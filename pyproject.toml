[project]
name = "ocp-copilot-mcp"
version = "0.1.0"
description = "MCP server for the OCP Co-Pilot - providing AI-powered tools for Omilia Cloud Platform management and automation"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "ocp", "omilia", "ai-assistant", "copilot", "voice-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]>=1.9.4",
    "requests>=2.32.4",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ipython",
]

[dependency-groups]
dev = [
    "ipython>=8.37.0",
]
